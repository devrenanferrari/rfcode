name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.email "ci@rfcode.dev" && git config --global user.name "rfcode CI"
      - run: npm test
      - name: Empacotar a extensão
        if: matrix.os == 'ubuntu-latest'
        run: npx --yes @vscode/vsce package
